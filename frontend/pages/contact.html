<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

 <link rel="stylesheet" href="../css/future.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/footer.css"/>
  
</head>
<body>
  <div class="navbar-container">
  <div class="navbar">
    <div class="logo">
      <img src="../assets/TunewaveLOGO.svg" alt="TuneWave Logo">
    </div>

    <div class="nav-links">
      <a href="Future.html" class="active" >Future</a>
      <a href="Solutions.html">Solutions</a>

       <a href="Contact Us.html" >Contact Us</a>

    </div>

    <a href="#" class="glass-button">
  More info <span>→</span>
</a>
  </div>
</div>

  <h2>Contact Us</h2>

  <!-- CONTACT FORM -->
  <div class="contact-container">
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="text" placeholder="Mobile Number" required>
      <input type="text" placeholder="Subject" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- PLACE + EMAIL SECTION -->
  <div class="info-section">
    <div class="info-box">
      <h3>📍 Place</h3>
      <textarea readonly>Hyderabad, Telangana, India</textarea>
    </div>
    <div class="info-box">
      <h3>📧 Email</h3>
      <textarea readonly>contact@tunewave.in</textarea>
    </div>
  </div>

  <!-- MAP SECTION -->
  <div class="map-container">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3806.531970265285!2d78.39954787493307!3d17.437462883452327!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb91b4d04a1d0b%3A0x5399b96d1c6c3bde!2sErragadda%2C%20Hyderabad%2C%20Telangana!5e0!3m2!1sen!2sin!4v1715940435323!5m2!1sen!2sin"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

</body>
